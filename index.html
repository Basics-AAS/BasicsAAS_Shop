<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BasicsAAS Storefront</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      max-width: 900px; 
      margin: 20px auto; 
      padding: 0 15px; 
      line-height: 1.6; 
      color: #333; 
      background-color: #2b2b2b; /* Dark grey background */
    }
    h1 { color: #ffffff; } /* White title text for contrast */
    .container { display: flex; flex-wrap: wrap; gap: 20px; }
    .products, .cart { flex: 1; min-width: 320px; border: 1px solid #444; padding: 20px; border-radius: 8px; background: #ffffff; }
    .product-item, .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
    
    /* Banner */
    .banner {
      width: 100%;
      max-height: 451px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 20px;
      display: block;
    }
    /* Dark Blue Buttons */
    button { background: #0d47a1; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 14px; }
    button:hover { background: #08306b; }

    /* Product Info */
    .product-item { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      gap: 12px;
      padding: 12px 0; 
      border-bottom: 1px solid #eee; 
    }
    .product-info {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }
    .product-img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #ddd;
      flex-shrink: 0;
    }
    .product-desc {
      font-size: 13px;
      color: #666;
      margin: 3px 0 0;
      line-height: 1.4;
    }
    
    /* Cart Quantity & Remove Controls */
    .qty-controls { display: flex; align-items: center; gap: 6px; }
    .qty-btn { background: #6e7781; padding: 3px 8px; font-weight: bold; }
    .qty-btn:hover { background: #57606a; }
    .remove-btn { background: #d73a49; padding: 4px 8px; font-size: 12px; margin-left: 5px; }
    .remove-btn:hover { background: #cb2431; }
    
    .summary-row { display: flex; justify-content: space-between; margin-top: 8px; font-size: 15px; }
    .total-row { display: flex; justify-content: space-between; font-size: 1.2em; font-weight: bold; margin: 12px 0 20px; padding-top: 10px; border-top: 2px solid #eee; }
    .form-section { border-top: 1px solid #ddd; padding-top: 15px; margin-top: 15px; }
    .form-group { margin-bottom: 12px; }
    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; }
    label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; }
    input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
    textarea { width: 100%; height: 260px; margin-top: 10px; padding: 12px; box-sizing: border-box; font-family: monospace; font-size: 13px; border: 1px solid #ccc; border-radius: 5px; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <img src="banner.png" alt="Store Banner" class="banner">
  
  <h1>Product Catalog</h1>
  
  <div class="container">
    <div class="products">
      <h2>Available Items</h2>
      <div id="product-list"></div>
    </div>

    <div class="cart">
      <h2>Your Cart</h2>
      <div id="cart-items"><p>Your cart is empty.</p></div>
      
      <div class="summary-row">
        <span>Subtotal:</span>
        <span>$<span id="cart-subtotal">0.00</span></span>
      </div>
      <div class="summary-row">
        <span>Flat Rate Shipping:</span>
        <span>$<span id="cart-shipping">0.00</span></span>
      </div>
      <div class="total-row">
        <span>Total:</span>
        <span>$<span id="cart-total">0.00</span></span>
      </div>

      <div class="form-section">
        <h3>Customer & Payment Details</h3>
        <div class="form-group">
          <label for="cust-name">Full Name *</label>
          <input type="text" id="cust-name" placeholder="Jane Doe" required>
        </div>
        <div class="form-group">
          <label for="cust-email">Email *</label>
          <input type="email" id="cust-email" placeholder="jane@example.com" required>
        </div>
        <div class="form-group">
          <label for="cust-address">Street Address *</label>
          <input type="text" id="cust-address" placeholder="123 Main St" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="cust-city">City *</label>
            <input type="text" id="cust-city" placeholder="Baltimore" required>
          </div>
          <div class="form-group">
            <label for="cust-state">State *</label>
            <input type="text" id="cust-state" placeholder="MD" required>
          </div>
          <div class="form-group">
            <label for="cust-zip">Zip *</label>
            <input type="text" id="cust-zip" placeholder="21201" required>
          </div>
        </div>
        <div class="form-group">
          <label for="payment-method">Payment Method *</label>
          <select id="payment-method" required>
            <option value="" disabled selected>Select a payment option...</option>
            <option value="Bitcoin">Bitcoin</option>
            <option value="Ethereum">Ethereum</option>
          </select>
        </div>
      </div>

      <button onclick="generateOrder()" style="width: 100%; font-size: 16px; margin-top: 10px;">Submit Order</button>
    </div>
  </div>
  
  <!-- Generated Text Output -->
  <div id="output-section" class="hidden" style="margin-top: 25px; border: 1px solid #ddd; padding: 20px; border-radius: 8px; background: #f9f9f9;">
    <h2>Order Summary</h2>
    <p>Click below to open your email app with this order filled out, or copy and paste it manually:</p>
    <textarea id="order-text" readonly></textarea>
    <div style="display: flex; gap: 10px; margin-top: 10px;">
      <button onclick="sendEmail()">Send via Email</button>
      <button onclick="copyText()">Copy to Clipboard</button>
    </div>
  </div>

  
  <script>
    const products = [
      { id: 1, image: "BasicsIconThumbnail.png", name: "Testosterone E", price: 30.00, desc: "250mg/ml" },
      { id: 2, image: "BasicsIconThumbnail.png", name: "Testosterone E", price: 35.00, desc: "300mg/ml" },
      { id: 3, image: "BasicsIconThumbnail.png", name: "Testosterone C", price: 30.00, desc: "200mg/ml" },
      { id: 4, image: "BasicsIconThumbnail.png", name: "Testosterone C", price: 35.00, desc: "250mg/ml" },
      { id: 5, image: "BasicsIconThumbnail.png", name: "BTestosterone P", price: 30.00, desc: "100mg/ml" },
      { id: 6, image: "BasicsIconThumbnail.png", name: "Sustanon 250", price: 40.00, desc: "250mg/ml" },
      { id: 7, image: "BasicsIconThumbnail.png", name: "Sustanon 250", price: 45.00, desc: "300mg/ml" },
      { id: 8, image: "BasicsIconThumbnail.png", name: "Nandrolone Decanoate", price: 30.00, desc: "200mg/ml" },
      { id: 9, image: "BasicsIconThumbnail.png", name: "Trenbolone E", price: 55.00, desc: "200mg/ml" },
      { id: 10, image: "BasicsIconThumbnail.png", name: "Trenbolone A", price: 45.00, desc: "100mg/ml" }


    ];

    const FLAT_SHIPPING = 20.00;
    let cart = [];

    document.addEventListener("DOMContentLoaded", () => {
      const productListEl = document.getElementById("product-list");
      products.forEach(product => {
        const div = document.createElement("div");
        div.className = "product-item";
        div.innerHTML = `
          <div class="product-info">
            <img src="${product.image}" alt="${product.name}" class="product-img">
            <div>
              <strong>${product.name}</strong> - $${product.price.toFixed(2)}
              <p class="product-desc">${product.desc}</p>
            </div>
          </div>
          <button onclick="addToCart(${product.id})" style="flex-shrink: 0;">Add to Cart</button>
        `;
        productListEl.appendChild(div);
      });
    });

    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      const existing = cart.find(item => item.id === productId);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ ...product, qty: 1 });
      }
      updateCartUI();
    }

    function changeQty(productId, delta) {
      const item = cart.find(i => i.id === productId);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) {
        removeFromCart(productId);
      } else {
        updateCartUI();
      }
    }

    function removeFromCart(productId) {
      cart = cart.filter(item => item.id !== productId);
      updateCartUI();
    }

    function updateCartUI() {
      const cartItemsEl = document.getElementById("cart-items");
      const subtotalEl = document.getElementById("cart-subtotal");
      const shippingEl = document.getElementById("cart-shipping");
      const totalEl = document.getElementById("cart-total");

      if (cart.length === 0) {
        cartItemsEl.innerHTML = "<p>Your cart is empty.</p>";
        subtotalEl.textContent = "0.00";
        shippingEl.textContent = "0.00";
        totalEl.textContent = "0.00";
        return;
      }

      cartItemsEl.innerHTML = "";
      let subtotal = 0;

      cart.forEach(item => {
        const itemTotal = item.price * item.qty;
        subtotal += itemTotal;
        const div = document.createElement("div");
        div.className = "cart-item";
        div.innerHTML = `
          <div>
            <strong>${item.name}</strong><br>
            <small>$${item.price.toFixed(2)} each = $${itemTotal.toFixed(2)}</small>
          </div>
          <div class="qty-controls">
            <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
            <span>${item.qty}</span>
            <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
            <button class="remove-btn" onclick="removeFromCart(${item.id})">Remove</button>
          </div>
        `;
        cartItemsEl.appendChild(div);
      });

      const grandTotal = subtotal + FLAT_SHIPPING;
      subtotalEl.textContent = subtotal.toFixed(2);
      shippingEl.textContent = FLAT_SHIPPING.toFixed(2);
      totalEl.textContent = grandTotal.toFixed(2);
    }

    function generateOrder() {
      if (cart.length === 0) {
        alert("Please add at least one item to your cart first.");
        return;
      }

      const name = document.getElementById("cust-name").value.trim();
      const email = document.getElementById("cust-email").value.trim();
      const address = document.getElementById("cust-address").value.trim();
      const city = document.getElementById("cust-city").value.trim();
      const state = document.getElementById("cust-state").value.trim();
      const zip = document.getElementById("cust-zip").value.trim();
      const payment = document.getElementById("payment-method").value;

      if (!name || !email || !address || !city || !state || !zip || !payment) {
        alert("Please fill out all customer fields and select a payment method.");
        return;
      }

      let summary = "NEW ORDER REQUEST\n";
      summary += "====================================\n";
      summary += "ITEMS ORDERED:\n";
      
      let subtotal = 0;
      cart.forEach(item => {
        const itemTotal = item.price * item.qty;
        subtotal += itemTotal;
        summary += `- ${item.qty}x ${item.name} @ $${item.price.toFixed(2)} = $${itemTotal.toFixed(2)}\n`;
      });

      const grandTotal = subtotal + FLAT_SHIPPING;

      summary += "------------------------------------\n";
      summary += `Subtotal: $${subtotal.toFixed(2)}\n`;
      summary += `Flat Rate Shipping: $${FLAT_SHIPPING.toFixed(2)}\n`;
      summary += `TOTAL DUE: $${grandTotal.toFixed(2)}\n`;
      summary += `Payment Method: ${payment}\n`;
      summary += "====================================\n";
      summary += "CUSTOMER DETAILS:\n";
      summary += `Name: ${name}\n`;
      summary += `Email: ${email}\n`;
      summary += `Address: ${address}\n`;
      summary += `City/State/Zip: ${city}, ${state} ${zip}\n`;
document.getElementById("order-text").value = summary;
document.getElementById("output-section").classList.remove("hidden");
}
function copyText() {
const textArea = document.getElementById("order-text");
textArea.select();
navigator.clipboard.writeText(textArea.value);
alert("Order copied to clipboard!");
}

function sendEmail() {
const storeEmail = "youremail@example.com"; // <-- REPLACE WITH YOUR EMAIL
const customerName = document.getElementById("cust-name").value.trim();
const orderBody = document.getElementById("order-text").value;
const subject = encodeURIComponent(New Order Request - ${customerName});
const body = encodeURIComponent(orderBody);
window.location.href = mailto:${storeEmail}?subject=${subject}&body=${body};
}
renderProducts();
  </script>
</body>
</html>
