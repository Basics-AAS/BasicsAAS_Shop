<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Storefront</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 0 15px; line-height: 1.6; }
    .container { display: flex; flex-wrap: wrap; gap: 20px; }
    .products, .cart { flex: 1; min-width: 300px; border: 1px solid #ddd; padding: 15px; border-radius: 8px; }
    .product-item, .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
    button { background: #2ea44f; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; }
    button:hover { background: #2c974b; }
    .remove-btn { background: #d73a49; padding: 4px 8px; font-size: 12px; }
    .total { font-size: 1.2em; font-weight: bold; margin: 15px 0; }
    textarea { width: 100%; height: 150px; margin-top: 10px; padding: 10px; box-sizing: border-box; font-family: monospace; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <h1>Product Catalog</h1>

  <div class="container">
    <!-- Product List -->
    <div class="products">
      <h2>Available Items</h2>
      <div id="product-list"></div>
    </div>

    <!-- Shopping Cart -->
    <div class="cart">
      <h2>Your Cart</h2>
      <div id="cart-items"><p>Your cart is empty.</p></div>
      <div class="total">Total: $<span id="cart-total">0.00</span></div>
      <button onclick="generateOrder()" style="width: 100%; font-size: 16px;">Submit Order</button>
    </div>
  </div>

  <!-- Generated Text Output -->
  <div id="output-section" class="hidden" style="margin-top: 25px;">
    <h2>Order Summary</h2>
    <p>Copy the text below and paste it into an email to complete your order:</p>
    <textarea id="order-text" readonly></textarea>
    <button onclick="copyText()" style="margin-top: 10px; background: #0366d6;">Copy to Clipboard</button>
  </div>

  <script>
    // 1. Edit your products here
    const products = [
      { id: 1, name: "Standard T-Shirt", price: 20.00 },
      { id: 2, name: "Canvas Tote Bag", price: 15.50 },
      { id: 3, name: "Ceramic Mug", price: 12.00 },
      { id: 4, name: "Sticker Pack", price: 5.00 }
    ];

    let cart = [];

    // Render products on load
    const productListEl = document.getElementById("product-list");
    products.forEach(product => {
      const div = document.createElement("div");
      div.className = "product-item";
      div.innerHTML = `
        <span><strong>${product.name}</strong> - $${product.price.toFixed(2)}</span>
        <button onclick="addToCart(${product.id})">Add to Cart</button>
      `;
      productListEl.appendChild(div);
    });

    // Add item to cart
    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      const existing = cart.find(item => item.id === productId);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ ...product, qty: 1 });
      }
      updateCartUI();
    }

    // Remove item from cart
    function removeFromCart(productId) {
      cart = cart.filter(item => item.id !== productId);
      updateCartUI();
    }

    // Update cart display and total
    function updateCartUI() {
      const cartItemsEl = document.getElementById("cart-items");
      const cartTotalEl = document.getElementById("cart-total");

      if (cart.length === 0) {
        cartItemsEl.innerHTML = "<p>Your cart is empty.</p>";
        cartTotalEl.textContent = "0.00";
        return;
      }

      cartItemsEl.innerHTML = "";
      let total = 0;

      cart.forEach(item => {
        const subtotal = item.price * item.qty;
        total += subtotal;
        const div = document.createElement("div");
        div.className = "cart-item";
        div.innerHTML = `
          <span>${item.name} (x${item.qty}) - $${subtotal.toFixed(2)}</span>
          <button class="remove-btn" onclick="removeFromCart(${item.id})">Remove</button>
        `;
        cartItemsEl.appendChild(div);
      });

      cartTotalEl.textContent = total.toFixed(2);
    }

    // Generate copy-paste text summary
    function generateOrder() {
      if (cart.length === 0) {
        alert("Please add at least one item to your cart first.");
        return;
      }

      let summary = "NEW ORDER REQUEST\n";
      summary += "-------------------------\n";
      let total = 0;

      cart.forEach(item => {
        const subtotal = item.price * item.qty;
        total += subtotal;
        summary += `${item.qty}x ${item.name} @ $${item.price.toFixed(2)} = $${subtotal.toFixed(2)}\n`;
      });

      summary += "-------------------------\n";
      summary += `TOTAL: $${total.toFixed(2)}\n\n`;
      summary += "Customer Name: \n";
      summary += "Shipping Address: \n";

      document.getElementById("order-text").value = summary;
      document.getElementById("output-section").classList.remove("hidden");
    }

    // Copy text to clipboard
    function copyText() {
      const textArea = document.getElementById("order-text");
      textArea.select();
      navigator.clipboard.writeText(textArea.value);
      alert("Order copied to clipboard!");
    }
  </script>

</body>
</html>
